<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pautas de ejercicios · Fisio Punción Seca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pautas Fisio">
<style>
:root{--bg:#eef3f4;--fg:#1f2430;--card:#fff;--bd:#d5dfe1;--ac:#2e9a9c;--ac2:#237b7d;--dk:#0f172a;--mu:#64707a;--nb:#fffbeb;--nbd:#fde68a;--nt:#7c2d12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171b;--fg:#eef2f3;--card:#1c2429;--bd:#33414a;--mu:#9aa8b1;--nb:#3a3010;--nbd:#7a6420;--nt:#fcd9a8}}
:root[data-theme="dark"]{--bg:#12171b;--fg:#eef2f3;--card:#1c2429;--bd:#33414a;--mu:#9aa8b1;--nb:#3a3010;--nbd:#7a6420;--nt:#fcd9a8}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:6px 0 14px}
.hero{background:linear-gradient(135deg,#0f172a,var(--ac));color:#fff;border-radius:18px;padding:26px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero img{height:92px;background:#fff;border-radius:12px;padding:6px}
.hero h1{margin:0;font-size:clamp(22px,5vw,34px)}.hero p{margin:6px 0 0;opacity:.88}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;cursor:pointer;text-align:left;color:var(--fg);box-shadow:0 2px 8px #0001;transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:var(--ac)}
.tile i,.num{display:inline-block;background:var(--dk);color:#fff;font:700 16px system-ui;padding:6px 12px;border-radius:6px;font-style:normal}
.tile i{margin-bottom:10px}.num{margin-right:8px}
.tile b{display:block;font-size:17px}.tile span{color:var(--mu);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{background:var(--ac2)}.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.btn.d{background:#c0392b}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%;width:100%}
.bar input,.bar select{width:auto}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
input[readonly],textarea[readonly]{background:var(--bg);opacity:.85}
textarea{min-height:76px;resize:vertical}
textarea.note{background:var(--nb);border-color:var(--nbd);color:var(--nt);min-height:56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.grid .card{margin:0}
.im{height:150px;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--mu);text-align:center;font-size:13px;padding:4px}
.im img{width:100%;height:100%;object-fit:contain}
.sl{display:grid;grid-template-columns:150px 1fr;gap:12px}
@media(max-width:560px){.sl{grid-template-columns:1fr}.im{height:190px}}
.f1,.f2 label,.f3 label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--card);border-radius:14px;padding:16px;width:min(900px,94vw);max-height:90vh;overflow:auto}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pk div{border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer;text-align:center;font-size:13px}
.pk div:hover{border-color:var(--ac)}.pk img{width:100%;height:100px;object-fit:contain;background:#fff;border-radius:6px}
.tag{display:inline-block;background:var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin:2px 2px 0 0}
</style></head><body>

let S={};try{S=JSON.parse(localStorage.getItem('fisio2'))||{}}catch(e){}
const blank=()=>({bid:'',name:'',desc:'',img:'',pos:'',sets:'',reps:'',rest:'',note:''});
const NEWD=()=>({patient:'',date:'',dx:'',n:4,hid:'',items:[0,1,2,3,4,5].map(blank)});
const norm=()=>{S.ex=S.ex||[];S.hist=S.hist||[];S.n=S.n||0;S.d=S.d||NEWD()};norm();
let st,warned=false,dbp;
const idb=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('fisio',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const load=async()=>{try{const db=await idb();return await new Promise(r=>{const q=db.transaction('k').objectStore('k').get('S');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
async function flush(){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(S,'S');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}catch(e){if(!warned){warned=true;alert('No se pudo guardar en este navegador (¿modo privado o almacenamiento lleno?). Exporta una copia de seguridad.')}}}
function save(){clearTimeout(st);st=setTimeout(flush,400)}
addEventListener('pagehide',()=>{clearTimeout(st);flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(st);flush()}});
async function boot(){const d=await load();if(d&&Array.isArray(d.ex)){S=d;norm()}else save();render()}

const ldI=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function pic(src){if(!src)return null;const k=src.length+src.slice(40,70);if(!(k in IMG))IMG[k]=await ldI(src);return IMG[k]}
function wrap(c,t,w,off){const out=[];for(const p of String(t||'').split('\n')){let l='';for(const wd of p.split(' ')){const x=l?l+' '+wd:wd,lim=out.length?w:w-off;if(c.measureText(x).width>lim&&l){out.push(l);l=wd}else l=x}out.push(l)}return out}
function rr(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}}
const T=(c,t,x,y,wt,sz,col,al)=>{c.font=wt+' '+sz+'px '+F;c.fillStyle=col;c.textAlign=al||'left';c.fillText(String(t),x,y)};
function fit(c,t,x,y,mw,wt,sz,col,al){let s=sz;c.font=wt+' '+s+'px '+F;while(c.measureText(t).width>mw&&s>14){s-=1;c.font=wt+' '+s+'px '+F}c.fillStyle=col;c.textAlign=al||'left';c.fillText(t,x,y)}
const LS=(c,v)=>{try{c.letterSpacing=v}catch(e){}};
function head(c,sh,logo){
 if(logo){const k=Math.min(150/logo.width,140/logo.height);c.drawImage(logo,84,100,logo.width*k,logo.height*k)}
 T(c,'fisio',262,122,'bold',54,'#0f172a');LS(c,'5px');T(c,'PUNCIÓN SECA',264,190,'600',25,'#475569');
 LS(c,'3px');T(c,'PAUTA DE EJERCICIOS',1156,120,'bold',24,'#0f172a','right');LS(c,'0px');
 fit(c,sh.patient||'',1156,160,560,'bold',36,'#0f172a','right');T(c,'Fecha: '+fmt(sh.date),1156,214,'normal',24,'#334155','right');
 c.fillStyle='#0f172a';c.fillRect(84,270,1072,4);
 let y=314;
 if(sh.dx){c.font='bold 23px '+F;const lw=c.measureText('Diagnóstico / Indicaciones: ').width;c.font='23px '+F;const L=wrap(c,sh.dx,1016,lw),h=30+L.length*32;
  rr(c,84,y,1072,h,22,'#fff','#e2e8f0',2);T(c,'Diagnóstico / Indicaciones:',112,y+16,'bold',23,'#0f172a');L.forEach((l,i)=>T(c,l,i?112:112+lw,y+16+i*32,'normal',23,'#475569'));y+=h+34}
 return y}
function lay(c,it){
 c.font='bold 25px '+F;const lw=c.measureText('Ejecución: ').width;c.font='25px '+F;const dl=wrap(c,it.desc,756,lw);
 c.font='bold 22px '+F;const nw=c.measureText('Notas: ').width;c.font='22px '+F;const nl=it.note?wrap(c,it.note,716,nw):[];
 const th=dl.length*35,nh=nl.length?26+nl.length*30:0,body=Math.max(236,th+20+78+(nh?16+nh:0));
 return{dl,nl,lw,nw,th,nh,h:108+body+30}}
function card(c,x,y,it,L,i,im){
 rr(c,x,y,1072,L.h,26,'#fff','#cbd5e1',2);
 T(c,i+1,x+36,y+36,'bold',22,'#9ca3af');
 let pw=0;if(it.pos){c.font='bold 22px '+F;pw=c.measureText('Posición: '+it.pos).width;T(c,'Posición: '+it.pos,x+1036,y+38,'bold',22,'#334155','right')}
 fit(c,it.name||'',x+82,y+28,1072-82-36-pw-24,'bold',32,'#0f172a');
 c.fillStyle='#e5e7eb';c.fillRect(x+25,y+84,1022,2);
 const y0=y+108,tx=x+291;
 rr(c,x+25,y0,236,236,18,'#fff','#e5e7eb',2);
 if(im){const k=Math.min(212/im.width,212/im.height);c.drawImage(im,x+143-im.width*k/2,y0+118-im.height*k/2,im.width*k,im.height*k)}
 T(c,'Ejecución:',tx,y0,'bold',25,'#334155');L.dl.forEach((l,j)=>T(c,l,j?tx:tx+L.lw,y0+j*35,'normal',25,'#334155'));
 const sy=y0+L.th+20;rr(c,tx,sy,756,78,14,'#fff','#e2e8f0',2);
 [['SERIES',it.sets,.02],['REPETICIONES / TIEMPO',it.reps,.35],['DESCANSO',it.rest,.67]].forEach(([l,v,p])=>{LS(c,'1px');T(c,l,tx+756*p,sy+13,'normal',16,'#475569');LS(c,'0px');if(v)fit(c,v,tx+756*p,sy+38,756*(p==.67?.31:.30),'bold',24,'#0f172a')});
 if(L.nh){const ny=sy+94;rr(c,tx,ny,756,L.nh,14,'#fffbeb','#fde68a',2);T(c,'Notas:',tx+20,ny+13,'bold',22,'#7c2d12');L.nl.forEach((l,j)=>T(c,l,j?tx+20:tx+20+L.nw,ny+13+j*30,'normal',22,'#7c2d12'))}}
async function pages(sh){
 const out=[],logo=await ldI(LOGO),ims=await Promise.all(sh.items.map(i=>pic(i.src)));let c,y;
 const np=first=>{const cv=document.createElement('canvas');cv.width=1240;cv.height=1754;c=cv.getContext('2d');c.textBaseline='top';c.fillStyle='#fff';c.fillRect(0,0,1240,1754);out.push(cv);y=first?head(c,sh,logo):84};
 np(true);
 sh.items.forEach((it,i)=>{const L=lay(c,it);if(y+L.h>1620&&y>100)np(false);card(c,84,y,it,L,i,ims[i]);y+=L.h+26});
 out.forEach((cv,i)=>{const g=cv.getContext('2d');g.textBaseline='top';g.fillStyle='#cbd5e1';g.fillRect(84,1650,1072,2);T(g,'fisiopuncionseca',84,1672,'normal',22,'#475569');T(g,'Atención Fisioterapéutica Personalizada',1156,1672,'normal',22,'#475569','right');if(out.length>1)T(g,(i+1)+'/'+out.length,620,1672,'normal',22,'#94a3b8','center')});
 return out}
function mkPdf(cvs){
 const enc=new TextEncoder(),parts=[],xr=[];let len=0;
 const add=u=>{if(typeof u==='string')u=enc.encode(u);parts.push(u);len+=u.length};
 const obj=(n,d,bin)=>{xr[n]=len;add(n+' 0 obj\n'+d+'\n');if(bin){add('stream\n');add(bin);add('\nendstream\n')}add('endobj\n')};
 const N=cvs.length;add('%PDF-1.4\n');
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Count '+N+'/Kids['+cvs.map((_,i)=>(5+3*i)+' 0 R').join(' ')+']>>');
 cvs.forEach((cv,i)=>{const b=atob(cv.toDataURL('image/jpeg',.9).split(',')[1]),u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);
  const im=3+3*i,ct=4+3*i,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(im,'<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+u.length+'>>',u);
  obj(ct,'<</Length '+cs.length+'>>',enc.encode(cs));
  obj(5+3*i,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>')});
 const tot=2+3*N,xo=len;let x='xref\n0 '+(tot+1)+'\n0000000000 65535 f \n';for(let n=1;n<=tot;n++)x+=String(xr[n]).padStart(10,'0')+' 00000 n \n';
 add(x+'trailer\n<</Size '+(tot+1)+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'})}
//#/PDF
let view='home',q='',hq='',pi=0,pq='';
const pad3=n=>String(n).padStart(3,'0');
const buildSheet=rec=>pages({...rec,items:rec.items.map(it=>{const b=it.bid&&S.ex.find(x=>x.id===it.bid);return{...it,src:it.img||(b&&b.img)||''}})});
const fname=r=>'pauta_'+r.patient.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W+/g,'_')+'_'+r.date+'.pdf';
async function sharePdf(rec){const blob=mkPdf(await buildSheet(rec)),name=fname(rec);
 try{const f=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const url=URL.createObjectURL(blob);
 $('#mbox').innerHTML=`<div class="bar"><b>${esc(name)}</b><button class="btn s" data-act="close">Cerrar</button></div><p>Tu navegador no permite compartir directamente. Pulsa para descargar o abrir el PDF y guárdalo desde ahí.</p><div class="bar"><a class="btn" href="${url}" download="${esc(name)}">Descargar PDF</a><a class="btn s" href="${url}" target="_blank">Abrir PDF</a></div>`;
 $('#modal').style.display='flex'}
function commit(items){items.forEach(it=>{if(it.bid)return;const nm=it.name.trim();let b=S.ex.find(x=>x.name.trim().toLowerCase()===nm.toLowerCase()&&x.desc===it.desc);
 if(!b){S.n++;b={id:'E'+pad3(S.n),name:nm,desc:it.desc,pos:it.pos||'',img:it.img||''};S.ex.push(b)}else{if(!b.img&&it.img)b.img=it.img;if(!b.pos&&it.pos)b.pos=it.pos}it.bid=b.id;it.img='';it.name=nm})}
async function generate(){const d=S.d,items=d.items.slice(0,d.n);
 if(!d.patient.trim())return alert('Escribe el nombre del paciente.');
 const bad=items.findIndex(i=>!i.name.trim());if(bad>=0)return alert('Al ejercicio '+(bad+1)+' le falta el nombre. Rellénalo, elígelo de la batería o reduce el número de ejercicios.');
 commit(items);
 const rec={id:uid(),date:d.date||today(),patient:d.patient.trim(),dx:d.dx,items:items.map(i=>({bid:i.bid,name:i.name,desc:i.desc,pos:i.pos,sets:i.sets,reps:i.reps,rest:i.rest,note:i.note}))};
 const old=S.hist.find(h=>h.id===d.hid);if(old&&old.patient===rec.patient){rec.id=old.id;Object.assign(old,rec)}else{S.hist.push(rec);d.hid=rec.id}
 save();toast('Guardado en el histórico y en la batería');await sharePdf(rec)}
async function preview(){const d=S.d,cv=await buildSheet({patient:d.patient,date:d.date||today(),dx:d.dx,items:d.items.slice(0,d.n)});
 $('#mbox').innerHTML=`<div class="bar"><b>Vista previa</b><button class="btn s" data-act="close">Cerrar</button></div>`+cv.map(x=>`<img src="${x.toDataURL('image/jpeg',.8)}" style="width:100%;margin-bottom:10px;border:1px solid var(--bd)">`).join('');$('#modal').style.display='flex'}
const slot=(it,i)=>{const lk=!!it.bid,b=lk&&S.ex.find(x=>x.id===it.bid),im=lk?(b&&b.img):it.img,ro=lk?'readonly':'',bp=lk&&b&&b.pos?'readonly':'',f=(k,l,x='')=>`<label>${l}<input data-s="${i}" data-f="${k}" ${x} value="${esc(it[k])}"></label>`;
 return `<div class="card"><div class="bar" style="margin:0;justify-content:space-between"><b style="font-size:17px"><span class="num">${i+1}</span>Ejercicio</b><span><button class="btn s" data-act="pk" data-i="${i}">${lk?'Cambiar':'Elegir de la batería'}</button> ${(lk||it.name||it.desc||it.img)?`<button class="btn s" data-act="vac" data-i="${i}">Vaciar</button>`:''}</span></div>
 <div class="sl"><label class="im">${im?`<img src="${im}">`:'Añadir foto del móvil'}${lk?'':`<input type="file" accept="image/*" data-simg="${i}" hidden>`}</label>
 <div class="col"><label class="f1">Nombre del ejercicio<input data-s="${i}" data-f="name" ${ro} value="${esc(it.name)}"></label>
 <label class="f1">Posición<input data-s="${i}" data-f="pos" list="dp" ${bp} value="${esc(it.pos)}"></label></div></div>
 <label class="f1">Descripción / ejecución${lk?' (de la batería)':''}<textarea data-s="${i}" data-f="desc" ${ro}>${esc(it.desc)}</textarea></label>
 <div class="f3">${f('sets','Series')}${f('reps','Repeticiones / tiempo')}${f('rest','Descanso')}</div>
 <label class="f1">Nota destacada (opcional)<textarea class="note" data-s="${i}" data-f="note" placeholder="Ej.: Si hay dolor parar inmediatamente">${esc(it.note)}</textarea></label></div>`};
const filt=()=>S.ex.filter(e=>!q||(e.name+' '+e.desc).toLowerCase().includes(q));
const bcard=e=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${e.id}</b><button class="btn d" data-act="dele" data-id="${e.id}">Eliminar</button></div><label class="im">${e.img?`<img src="${e.img}">`:'Añadir imagen'}<input type="file" accept="image/*" data-img="${e.id}" hidden></label><label class="f1">Nombre<input data-e="${e.id}" data-f="name" value="${esc(e.name)}"></label><label class="f1">Posición<input data-e="${e.id}" data-f="pos" list="dp" value="${esc(e.pos)}"></label><label class="f1">Descripción del ejercicio<textarea data-e="${e.id}" data-f="desc">${esc(e.desc)}</textarea></label></div>`;
const bat=()=>filt().map(bcard).join('')||'<p>No hay ejercicios. Se añaden solos al generar una pauta con un ejercicio nuevo, o créalos aquí.</p>';
const pkl=()=>{const L=S.ex.filter(e=>!pq||(e.name+' '+e.desc).toLowerCase().includes(pq));return L.length?L.map(e=>`<div data-act="pick" data-id="${e.id}">${e.img?`<img src="${e.img}">`:''}<b>${esc(e.name||'Sin nombre')}</b><br><small>${esc(e.pos||'')}</small></div>`).join(''):'<p>La batería está vacía.</p>'};
const hl=()=>{const L=S.hist.filter(h=>!hq||(h.patient+' '+h.items.map(i=>i.name).join(' ')).toLowerCase().includes(hq)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 return L.length?L.map(h=>`<div class="card"><div><b style="font-size:17px">${esc(h.patient)}</b><div style="color:var(--mu)">${fmt(h.date)} · ${h.items.length} ejercicios</div></div><div>${h.items.map(i=>`<span class="tag">${esc(i.name)}</span>`).join('')}</div><div class="bar" style="margin:0"><button class="btn" data-act="hpdf" data-id="${h.id}">PDF</button><button class="btn s" data-act="hre" data-id="${h.id}">Reutilizar para otro paciente</button><button class="btn d" data-act="hd" data-id="${h.id}">Eliminar</button></div></div>`).join(''):'<p>No hay envíos que coincidan.</p>'};
function render(){const a=$('#app');
 if(view==='home'){a.innerHTML=`<div class="hero"><img src="${LOGO}" alt="Fisio Punción Seca"><div><h1>Pautas de ejercicios</h1><p>Crea la pauta, envíala en PDF y consulta todo lo enviado a cada paciente.</p></div></div>
 <div class="home"><button class="tile" data-act="go" data-v="ho"><i>01</i><b>Nueva pauta</b><span>Elige ejercicios, rellena y genera el PDF</span></button>
 <button class="tile" data-act="go" data-v="ba"><i>02</i><b>Batería de ejercicios</b><span>${S.ex.length} ejercicios guardados</span></button>
 <button class="tile" data-act="go" data-v="hi"><i>03</i><b>Histórico</b><span>${S.hist.length} envíos registrados</span></button></div>
 <div class="bar" style="justify-content:center;margin-top:26px"><button class="btn s" data-act="bkx">Exportar copia de seguridad</button><label class="btn s" style="cursor:pointer">Importar copia<input type="file" id="imp" accept=".json,application/json" hidden></label></div>`;return}
 const back=`<div class="bar"><button class="btn s" data-act="go" data-v="home">← Inicio</button><b style="color:var(--ac)">Fisio · Punción seca</b></div>`;
 if(view==='ho'){const d=S.d;
  a.innerHTML=back+`<h2>Nueva pauta</h2><div class="card"><div class="f2"><label class="f1">Paciente<input id="pac" list="dpat" value="${esc(d.patient)}" placeholder="Nombre del paciente"></label><label class="f1">Fecha<input id="fec" type="date" value="${d.date||today()}"></label></div>
  <label class="f1" style="max-width:260px">Número de ejercicios<select id="nn">${[4,5,6].map(n=>`<option ${n===d.n?'selected':''}>${n}</option>`).join('')}</select></label>
  <label class="f1">Diagnóstico / indicaciones (opcional)<textarea id="dxx">${esc(d.dx)}</textarea></label></div>`+d.items.slice(0,d.n).map(slot).join('')+
  `<div class="bar"><button class="btn" data-act="gen">Generar PDF y guardar</button><button class="btn s" data-act="prev">Vista previa</button><button class="btn s" data-act="clr">Nueva pauta (limpiar)</button></div>`;
  $('#dpat').innerHTML=[...new Set(S.hist.map(h=>h.patient))].map(p=>`<option>${esc(p)}</option>`).join('')}
 if(view==='ba')a.innerHTML=back+`<h2>Batería de ejercicios</h2><div class="bar"><input id="q" placeholder="Buscar ejercicio…" value="${esc(q)}"><button class="btn" data-act="adde">+ Nuevo ejercicio</button></div><div class="grid" id="bl">${bat()}</div>`;
 if(view==='hi'){a.innerHTML=back+`<h2>Histórico</h2><div class="bar"><input id="hq" list="dpat" placeholder="Filtrar por paciente…" value="${esc(hq)}"></div><div class="grid" id="hl">${hl()}</div>`;
  $('#dpat').innerHTML=[...new Set(S.hist.map(h=>h.patient))].map(p=>`<option>${esc(p)}</option>`).join('')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset,m=()=>{$('#modal').style.display='none'};
 if(a==='go'){view=d.v;render()}
 else if(a==='close')m();
 else if(a==='gen')generate();
 else if(a==='prev')preview();
 else if(a==='clr'){if(confirm('¿Empezar una pauta nueva? Se borra lo que hay en pantalla (el histórico no cambia).')){S.d=NEWD();save();render()}}
 else if(a==='pk'){pi=+d.i;pq='';$('#mbox').innerHTML=`<div class="bar"><b>Elegir ejercicio</b><input id="pq" placeholder="Buscar…"><button class="btn s" data-act="close">Cerrar</button></div><div class="pk" id="pl">${pkl()}</div>`;$('#modal').style.display='flex'}
 else if(a==='pick'){const b=S.ex.find(x=>x.id===d.id),it=S.d.items[pi];if(b){Object.assign(it,{bid:b.id,name:b.name,desc:b.desc,img:'',pos:b.pos||it.pos});save();m();render()}}
 else if(a==='vac'){const it=S.d.items[+d.i];Object.assign(it,{bid:'',name:'',desc:'',img:''});save();render()}
 else if(a==='adde'){S.n++;S.ex.push({id:'E'+pad3(S.n),name:'',desc:'',pos:'',img:''});save();render()}
 else if(a==='dele'){if(confirm('¿Eliminar ejercicio de la batería? Las pautas ya enviadas conservan el texto, pero perderán la imagen.')){S.ex=S.ex.filter(x=>x.id!==d.id);S.d.items.forEach(i=>{if(i.bid===d.id)i.bid=''});save();render()}}
 else if(a==='hpdf'){const h=S.hist.find(x=>x.id===d.id);if(h)sharePdf(h)}
 else if(a==='hre'){const h=S.hist.find(x=>x.id===d.id);if(!h)return;const n=Math.min(6,Math.max(4,h.items.length));S.d=NEWD();S.d.n=n;S.d.dx=h.dx||'';h.items.forEach((it,i)=>{if(i<6)S.d.items[i]={...blank(),...it,bid:S.ex.some(x=>x.id===it.bid)?it.bid:''}});save();view='ho';render();toast('Pauta cargada: escribe el nuevo paciente')}
 else if(a==='hd'){if(confirm('¿Eliminar este envío del histórico?')){S.hist=S.hist.filter(x=>x.id!==d.id);save();$('#hl').innerHTML=hl()}}
 else if(a==='bkx')exportBk()});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.s!==undefined){const it=S.d.items[+d.s];it[d.f]=t.value;if(d.f==='pos'&&it.bid){const b=S.ex.find(x=>x.id===it.bid);if(b)b.pos=t.value}save()}
 else if(d.e){const x=S.ex.find(q=>q.id===d.e);if(x){x[d.f]=t.value;save()}}
 else if(t.id==='pac'){S.d.patient=t.value;save()}
 else if(t.id==='fec'){S.d.date=t.value;save()}
 else if(t.id==='dxx'){S.d.dx=t.value;save()}
 else if(t.id==='q'){q=t.value.toLowerCase();$('#bl').innerHTML=bat()}
 else if(t.id==='pq'){pq=t.value.toLowerCase();$('#pl').innerHTML=pkl()}
 else if(t.id==='hq'){hq=t.value.toLowerCase();$('#hl').innerHTML=hl()}});
function rs(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id==='nn'){S.d.n=+t.value;save();render()}
 else if(t.id==='imp'&&t.files[0]){importBk(t.files[0]);t.value=''}
 else if(d.simg!==undefined&&t.files[0])rs(t.files[0],u=>{S.d.items[+d.simg].img=u;save();render()});
 else if(d.img&&t.files[0])rs(t.files[0],u=>{S.ex.find(x=>x.id===d.img).img=u;save();render()})});
async function exportBk(){const json=JSON.stringify(S),name='copia_fisio_'+today()+'.json';
 try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
